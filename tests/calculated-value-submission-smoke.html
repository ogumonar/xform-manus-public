<!doctype html><html><head><meta charset="utf-8"><script src="../src/worker/xform-engine-client.js"></script></head><body><p id="result">Running…</p><script>(()=>{const result=document.querySelector('#result');const client=new XFormRevival.XFormEngineClient();let origin=0;client.addEventListener('hydrated',()=>{origin=client.intent({kind:'set-value',nodeId:0,value:'source'});});client.addEventListener('patches',({detail})=>{if(detail.sequence===origin){client.submitCalculatedValues(origin,[{nodeId:1,value:'calculated'}]);return;}if(detail.sequence>origin&&detail.patches.some(p=>p.nodeId===1&&p.state.value==='calculated')){result.textContent='PASS: Sequenced calculated values re-enter the worker mutation and patch flow.';document.title='PASS';client.dispose();}});client.hydrate({nodeCount:2});setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';client.dispose();}},4000)})()</script></body></html>
