<!doctype html><html><head><meta charset="utf-8"><script src="../src/adapter/xforms-toggle-action-bridge.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" enable-toggle-actions node-count="0"><xf:trigger id="show-details"><xf:toggle case="details"></xf:toggle></xf:trigger><xforms-trigger id="show-details" label="Details"></xforms-trigger><xforms-switch id="panel" selected-case="summary"><xforms-case case-id="summary">Summary</xforms-case><xforms-case case-id="details">Details</xforms-case></xforms-switch></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),trigger=document.querySelector('xforms-trigger'),switchElement=document.querySelector('#panel'),details=document.querySelector('xforms-case[case-id=details]'),result=document.querySelector('#result');let applied=null;host.addEventListener('xforms-toggle-applied',e=>applied=e.detail);host.addEventListener('xforms-action-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>trigger.shadowRoot.querySelector('button').click());const tick=()=>{if(applied?.caseId==='details'&&!details.hidden&&switchElement.state.selectedCase==='details'){result.textContent='PASS: Direct toggle actions update switch case projection without worker mutation.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
