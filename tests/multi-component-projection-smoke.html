<!doctype html><html><head><meta charset="utf-8"><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" node-count="1" initial-values='[{"nodeId":0,"value":"Ada"}]'><xforms-input id="editor" node-id="0" label="Editor"></xforms-input><xforms-output id="first-view" node-id="0" label="First view"></xforms-output><xforms-output id="second-view" node-id="0" label="Second view"></xforms-output></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),editor=document.querySelector('#editor'),first=document.querySelector('#first-view'),second=document.querySelector('#second-view'),result=document.querySelector('#result');host.addEventListener('xforms-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.join(' ')}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>{const input=editor.shadowRoot.querySelector('input');input.value='Grace';input.dispatchEvent(new Event('input',{bubbles:true,composed:true}));});const tick=()=>{if(first.shadowRoot?.textContent.includes('Grace')&&second.shadowRoot?.textContent.includes('Grace')){result.textContent='PASS: One worker patch projects to every component registered for a compact node.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
