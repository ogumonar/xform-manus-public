<!doctype html><html><head><meta charset="utf-8"><script src="../src/adapter/xforms-reset-action-bridge.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" enable-reset-actions discover-model><xf:model><xf:instance><data><name>Ada</name></data></xf:instance></xf:model><xf:trigger id="reset-name"><xf:reset></xf:reset></xf:trigger><xforms-input id="name" node-id="1" label="Name"></xforms-input><xforms-trigger id="reset-name" label="Reset name"></xforms-trigger></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),name=document.querySelector('#name'),trigger=document.querySelector('xforms-trigger'),result=document.querySelector('#result');let stage=0,resetSequence=0;const fail=message=>{if(!result.textContent.startsWith('PASS')){result.textContent=`FAIL: ${message}`;document.title='FAIL';}};host.addEventListener('xforms-action-diagnostic',e=>fail(e.detail.message));host.addEventListener('xforms-reset-applied',e=>{resetSequence=e.detail.sequence;});const waitForClient=()=>{if(!host.engineClient)return queueMicrotask(waitForClient);host.engineClient.addEventListener('patches',e=>{const patch=e.detail.patches.find(candidate=>candidate.nodeId===1);if(stage===0&&patch?.state?.value==='Grace'){stage=1;trigger.shadowRoot.querySelector('button').click();return;}if(stage===1&&e.detail.sequence===resetSequence&&e.detail.metrics?.fullSnapshot===true&&e.detail.metrics?.reset===true){if(name.shadowRoot.querySelector('input').value!=='Ada')return fail('Reset snapshot did not restore the initial worker value.');result.textContent='PASS: Direct reset action restores the worker hydration baseline through a full snapshot.';document.title='PASS';}});};waitForClient();host.addEventListener('xforms-ready',()=>{const input=name.shadowRoot.querySelector('input');input.value='Grace';input.dispatchEvent(new Event('input',{bubbles:true,composed:true}));});setTimeout(()=>{if(!result.textContent.startsWith('PASS'))fail('timed out');},5000)})()</script></body></html>
