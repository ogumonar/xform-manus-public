<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-bind-target-resolver.js"></script><script src="../src/adapter/xforms-discovered-repeat-projector.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model project-repeats><xf:model><xf:instance><data><person>Ada</person><person>Grace</person></data></xf:instance><xf:bind id="people" nodeset="/data/person"></xf:bind></xf:model><xforms-repeat id="repeat" bind-id="people"><template><span class="person-template">Person</span></template></xforms-repeat></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),repeat=document.querySelector('#repeat'),result=document.querySelector('#result');host.addEventListener('xforms-repeat-projection-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>{try{const occurrences=Array.from(repeat.shadowRoot.querySelectorAll('[part=occurrence]'));if(occurrences.length!==2||occurrences[0].dataset.repeatKey!=='node-1'||occurrences[1].dataset.repeatKey!=='node-2')throw new Error('Discovered collection did not project ordered compact keys.');if(!occurrences.every(item=>item.querySelector('.person-template')))throw new Error('Repeat projection did not preserve the view template.');result.textContent='PASS: Discovered collection binding projects keyed repeat occurrences without component XML ownership.';document.title='PASS';}catch(error){result.textContent=`FAIL: ${error.message}`;document.title='FAIL';}});setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
