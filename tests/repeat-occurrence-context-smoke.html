<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-bind-target-resolver.js"></script><script src="../src/adapter/xforms-discovered-repeat-projector.js"></script><script src="../src/adapter/xforms-repeat-occurrence-context-adapter.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model project-repeats bind-repeat-controls><xf:model><xf:instance><data><person><name>Ada</name></person><person><name>Grace</name></person></data></xf:instance><xf:bind id="people" nodeset="/data/person"></xf:bind></xf:model><xforms-repeat id="repeat" bind-id="people"><template><xforms-input class="person" ref="."></xforms-input><xforms-output class="name" ref="name"></xforms-output></template></xforms-repeat></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),repeat=document.querySelector('#repeat'),result=document.querySelector('#result');host.addEventListener('xforms-repeat-context-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>{try{const occurrences=Array.from(repeat.shadowRoot.querySelectorAll('[part=occurrence]'));if(occurrences.length!==2)throw new Error('Expected two projected repeat occurrences.');const controls=occurrences.map(occurrence=>({person:occurrence.querySelector('.person'),name:occurrence.querySelector('.name')}));if(controls[0].person.getAttribute('node-id')!=='1'||controls[0].name.getAttribute('node-id')!=='2'||controls[1].person.getAttribute('node-id')!=='3'||controls[1].name.getAttribute('node-id')!=='4')throw new Error('Occurrence-local controls did not receive the expected compact node IDs.');if(controls[0].person.dataset.xformsRepeatContextKey!=='node-1'||controls[1].name.dataset.xformsRepeatContextKey!=='node-3')throw new Error('Occurrence-local context keys were not exposed on cloned controls.');if(!controls[0].name.shadowRoot.textContent.includes('Ada')||!controls[1].name.shadowRoot.textContent.includes('Grace'))throw new Error('Worker hydration did not project child values into occurrence-local output controls.');result.textContent='PASS: Repeat occurrence context binds cloned controls to proven local compact targets.';document.title='PASS';}catch(error){result.textContent=`FAIL: ${error.message}`;document.title='FAIL';}});setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
