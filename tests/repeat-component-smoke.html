<!doctype html><html><head><meta charset="utf-8"><script src="../src/components/xforms-components.js"></script></head><body><xforms-repeat id="repeat" repeat-id="people"><template><span class="template-marker">Person occurrence</span></template></xforms-repeat><p id="result">Running…</p><script>(()=>{const repeat=document.querySelector('#repeat'),result=document.querySelector('#result');try{let eventDetail=null;repeat.addEventListener('xforms-repeat-index',e=>eventDetail=e.detail);repeat.setControlState({items:[{key:'ada',label:'Ada'},{key:'grace',label:'Grace'}],repeatIndex:2});const occurrences=()=>Array.from(repeat.shadowRoot.querySelectorAll('[part=occurrence]'));let list=occurrences();if(list.length!==2||list[0].dataset.repeatKey!=='ada'||list[1].getAttribute('aria-current')!=='true')throw new Error('Initial keyed occurrences or selected index were not rendered.');const ada=list[0];if(!ada.querySelector('.template-marker'))throw new Error('Template content was not cloned into occurrence.');repeat.setControlState({items:[{key:'grace',label:'Grace'},{key:'ada',label:'Ada'}],repeatIndex:1});list=occurrences();if(list[1]!==ada||list[0].dataset.repeatKey!=='grace'||list[0].getAttribute('aria-current')!=='true')throw new Error('Keyed reconciliation did not preserve Ada during reorder.');list[1].click();if(eventDetail?.repeatId!=='people'||eventDetail?.repeatIndex!==2||eventDetail?.key!=='ada')throw new Error('Repeat index event was not composed with the selected keyed occurrence.');repeat.setControlState({relevant:false});if(!repeat.hidden)throw new Error('Irrelevant repeat remained visible.');result.textContent='PASS: Keyed repeat projection preserves occurrences and emits one-based index events.';document.title='PASS';}catch(error){result.textContent=`FAIL: ${error.message}`;document.title='FAIL';}})()</script></body></html>
