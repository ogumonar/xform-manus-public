<!doctype html><html><head><meta charset="utf-8"><script src="../src/adapter/xforms-action-declaration-source.js"></script><script src="../src/adapter/xforms-setfocus-action-bridge.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" enable-setfocus-actions node-count="1"><xf:trigger id="focus-name"><xf:setfocus control="name"></xf:setfocus></xf:trigger><xforms-trigger id="focus-name" label="Focus name"></xforms-trigger><xforms-input id="name" node-id="0" label="Name"></xforms-input></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),trigger=document.querySelector('xforms-trigger'),target=document.querySelector('#name'),result=document.querySelector('#result');let applied=null;host.addEventListener('xforms-setfocus-applied',e=>applied=e.detail);host.addEventListener('xforms-action-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>trigger.shadowRoot.querySelector('button').click());const tick=()=>{if(applied?.controlId==='name'&&target.shadowRoot.activeElement?.tagName==='INPUT'){result.textContent='PASS: Direct setfocus actions delegate focus through the target component.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
