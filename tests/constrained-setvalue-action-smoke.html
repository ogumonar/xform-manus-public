<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/xpath/xforms-property-evaluator.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-action-declaration-source.js"></script><script src="../src/adapter/xforms-setvalue-action-bridge.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model enable-setvalue-actions><xf:model><xf:instance><data xmlns:ex="urn:example"><name>Initial</name><ex:given>Action</ex:given></data></xf:instance></xf:model><xf:trigger id="change-name" xmlns:ex="urn:example"><xf:setvalue ref="/data/name" value="concat(/data/ex:given, ' updated')"></xf:setvalue></xf:trigger><xforms-trigger id="change-name" label="Change name"></xforms-trigger><xforms-output id="name" node-id="1" label="Name"></xforms-output></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),trigger=document.querySelector('xforms-trigger'),name=document.querySelector('#name'),result=document.querySelector('#result');host.addEventListener('xforms-action-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>trigger.shadowRoot.querySelector('button').click());const tick=()=>{if(name.shadowRoot?.textContent.includes('Action updated')){result.textContent='PASS: Direct trigger setvalue actions resolve one target and mutate through the worker.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
