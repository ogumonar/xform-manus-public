<!doctype html><html><head><meta charset="utf-8"><script src="../src/adapter/xforms-action-declaration-source.js"></script><script src="../src/adapter/xforms-message-action-bridge.js"></script><script src="../src/adapter/xforms-component-adapter.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" enable-message-actions node-count="1"><xf:trigger id="show-message"><xf:label>Show message</xf:label><xf:message level="ephemeral">Adapted message.</xf:message></xf:trigger></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),result=document.querySelector('#result');const fail=message=>{result.textContent=`FAIL: ${message}`;document.title='FAIL';};let received=null;host.addEventListener('xforms-message',e=>received=e.detail);host.addEventListener('xforms-adapter-diagnostic',e=>fail(e.detail.message));host.addEventListener('xforms-action-diagnostic',e=>fail(e.detail.message));try{const summary=XFormRevival.XFormsComponentAdapter.upgrade(host);const trigger=document.querySelector('xforms-trigger#show-message');if(summary.upgraded!==1||!trigger?.querySelector('template[data-xforms-action-declarations]')?.content.querySelector('xf\\:message'))throw new Error('Adapted trigger did not retain its inert message declaration.');}catch(error){fail(error.message);return;}host.addEventListener('xforms-ready',()=>document.querySelector('xforms-trigger#show-message').shadowRoot.querySelector('button').click());const tick=()=>{if(received?.originControlId==='show-message'&&received?.message==='Adapted message.'&&received?.level==='ephemeral'){result.textContent='PASS: Adapted source trigger message declarations remain available to the direct message bridge.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS'))fail('timed out');},5000)})()</script></body></html>
