<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-bind-target-resolver.js"></script><script src="../src/adapter/xforms-static-dependency-extractor.js"></script><script src="../src/xpath/xforms-property-evaluator.js"></script><script src="../src/adapter/xforms-primitive-type-validator.js"></script><script src="../src/adapter/xforms-constrained-recalculator.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model register-static-dependencies recalculate-calculates><xf:model><xf:instance><data><source>show</source><detail>Visible</detail></data></xf:instance><xf:bind nodeset="/data/detail" relevant="../source = 'show'" required="true()"></xf:bind></xf:model><xforms-input id="source" node-id="1" label="Source"></xforms-input><xforms-output id="detail" node-id="2" label="Detail"></xforms-output></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),source=document.querySelector('#source'),detail=document.querySelector('#detail'),result=document.querySelector('#result');host.addEventListener('xforms-recalculation-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>{const input=source.shadowRoot.querySelector('input');input.value='hide';input.dispatchEvent(new Event('input',{bubbles:true,composed:true}));});const tick=()=>{if(detail.hidden){result.textContent='PASS: Constrained recalculation submits resolved model-item state after source intents.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
