<!doctype html><html><head><meta charset="utf-8"><script src="../src/adapter/xforms-dispatch-action-bridge.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" enable-dispatch-actions node-count="1"><xf:trigger id="send-signal"><xf:dispatch name="example-signal" targetid="target"></xf:dispatch></xf:trigger><xforms-trigger id="send-signal" label="Send signal"></xforms-trigger><xforms-output id="target" node-id="0" label="Target"></xforms-output></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),trigger=document.querySelector('xforms-trigger'),target=document.querySelector('#target'),result=document.querySelector('#result');let received=null,applied=null;target.addEventListener('example-signal',e=>received=e.detail);host.addEventListener('xforms-dispatch-applied',e=>applied=e.detail);host.addEventListener('xforms-action-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>trigger.shadowRoot.querySelector('button').click());const tick=()=>{if(received?.originControlId==='send-signal'&&received?.targetId==='target'&&applied?.eventName==='example-signal'&&applied?.targetId==='target'){result.textContent='PASS: Direct dispatch actions send one custom event to the explicit target component.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
