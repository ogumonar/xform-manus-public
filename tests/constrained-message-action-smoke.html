<!doctype html><html><head><meta charset="utf-8"><script src="../src/adapter/xforms-action-declaration-source.js"></script><script src="../src/adapter/xforms-message-action-bridge.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" enable-message-actions node-count="1"><xf:trigger id="show-message"><xf:message level="ephemeral">Saved successfully.</xf:message></xf:trigger><xforms-trigger id="show-message" label="Show message"></xforms-trigger></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),trigger=document.querySelector('xforms-trigger'),result=document.querySelector('#result');let received=null;host.addEventListener('xforms-message',e=>received=e.detail);host.addEventListener('xforms-action-diagnostic',e=>{result.textContent=`FAIL: ${e.detail.message}`;document.title='FAIL'});host.addEventListener('xforms-ready',()=>trigger.shadowRoot.querySelector('button').click());const tick=()=>{if(received?.originControlId==='show-message'&&received?.message==='Saved successfully.'&&received?.level==='ephemeral'){result.textContent='PASS: Direct message actions emit one structured host message event.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
