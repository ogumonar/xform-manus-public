<!doctype html><html><head><meta charset="utf-8"><script src="../src/worker/xform-engine-client.js"></script></head><body><p id="result">Running…</p><script>(()=>{const result=document.querySelector('#result');const client=new XFormRevival.XFormEngineClient();let origin=0;client.addEventListener('hydrated',()=>{origin=client.intent({kind:'activate',nodeId:0});});client.addEventListener('patches',({detail})=>{if(detail.sequence===origin){client.submitResolvedModelItemState(origin,[{nodeId:0,flags:0x06}]);return;}if(detail.sequence>origin&&detail.patches.some(p=>p.nodeId===0&&!p.state.relevant&&!p.state.readonly&&p.state.required&&!p.state.valid)){result.textContent='PASS: Sequenced resolved model-item state re-enters the worker patch flow.';document.title='PASS';client.dispose();}});client.hydrate({nodeCount:1});setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';client.dispose();}},4000)})()</script></body></html>
