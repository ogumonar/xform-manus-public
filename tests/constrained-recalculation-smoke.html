<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-bind-target-resolver.js"></script><script src="../src/adapter/xforms-static-dependency-extractor.js"></script><script src="../src/xpath/xforms-property-evaluator.js"></script><script src="../src/adapter/xforms-primitive-type-validator.js"></script><script src="../src/adapter/xforms-constrained-recalculator.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model register-static-dependencies recalculate-calculates><xf:model><xf:instance><data><source>Ada</source><name>Unknown</name></data></xf:instance><xf:bind nodeset="/data/name" calculate="concat(../source, ' Lovelace')"></xf:bind></xf:model><xforms-input id="source" node-id="1" label="Source"></xforms-input><xforms-output id="name" node-id="2" label="Name"></xforms-output></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),source=document.querySelector('#source'),name=document.querySelector('#name'),result=document.querySelector('#result');let ready=false;host.addEventListener('xforms-recalculation-diagnostic',e=>{throw new Error(e.detail.message)});host.engineClient?.addEventListener?.('patches',()=>{});host.addEventListener('xforms-ready',()=>{ready=true;const input=source.shadowRoot.querySelector('input');input.value='Grace';input.dispatchEvent(new Event('input',{bubbles:true,composed:true}));});const tick=()=>{if(ready&&name.shadowRoot?.textContent.includes('Grace Lovelace')){result.textContent='PASS: Constrained browser-model recalculation submits calculated patches after source intents.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS')){result.textContent='FAIL: timed out';document.title='FAIL';}},5000)})()</script></body></html>
