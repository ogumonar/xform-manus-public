<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-bind-target-resolver.js"></script><script src="../src/adapter/xforms-discovered-repeat-projector.js"></script><script src="../src/adapter/xforms-repeat-occurrence-context-adapter.js"></script><script src="../src/adapter/xforms-component-adapter.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model project-repeats bind-repeat-controls><xf:model><xf:instance><data><person><name>Ada</name></person><person><name>Grace</name></person></data></xf:instance><xf:bind id="people" nodeset="/data/person"></xf:bind></xf:model><xf:repeat id="people-repeat" bind="people"><xf:input class="person" ref="."><xf:label>Person</xf:label></xf:input><xf:output class="name" ref="name"><xf:label>Name</xf:label></xf:output></xf:repeat></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),result=document.querySelector('#result');const fail=message=>{result.textContent=`FAIL: ${message}`;document.title='FAIL';};host.addEventListener('xforms-adapter-diagnostic',e=>fail(e.detail.message));host.addEventListener('xforms-repeat-context-diagnostic',e=>fail(e.detail.message));try{const summary=XFormRevival.XFormsComponentAdapter.upgrade(host);if(summary.upgraded!==3)throw new Error(`Expected source repeat plus two controls to adapt, got ${summary.upgraded}.`);const repeat=document.querySelector('#people-repeat');if(repeat?.localName!=='xforms-repeat'||repeat.getAttribute('bind-id')!=='people'||repeat.querySelector('template')?.content.querySelectorAll('xforms-input,xforms-output').length!==2)throw new Error('Source repeat was not adapted to a repeat component template.');}catch(error){fail(error.message);return;}host.addEventListener('xforms-ready',()=>{try{const repeat=document.querySelector('#people-repeat');const occurrences=Array.from(repeat.shadowRoot.querySelectorAll('[part=occurrence]'));const names=occurrences.map(occurrence=>occurrence.querySelector('.name'));if(occurrences.length!==2||names[0]?.getAttribute('node-id')!=='2'||names[1]?.getAttribute('node-id')!=='4'||!names[0].shadowRoot.textContent.includes('Ada')||!names[1].shadowRoot.textContent.includes('Grace'))throw new Error('Adapted source repeat did not project occurrence-local child controls.');result.textContent='PASS: Source xf:repeat bind markup adapts into projected occurrence-local controls.';document.title='PASS';}catch(error){fail(error.message);}});setTimeout(()=>{if(!result.textContent.startsWith('PASS'))fail('timed out');},5000)})()</script></body></html>
