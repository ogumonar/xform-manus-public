<!doctype html><html><head><meta charset="utf-8"><script src="../src/adapter/xforms-reset-action-bridge.js"></script><script src="../src/adapter/xforms-component-adapter.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" enable-reset-actions node-count="2" inline-instance-xml="&lt;data&gt;&lt;name&gt;Ada&lt;/name&gt;&lt;/data&gt;"><xforms-input id="name" node-id="1" label="Name"></xforms-input><xf:trigger id="restore"><xf:label>Restore</xf:label><xf:reset></xf:reset></xf:trigger></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),result=document.querySelector('#result');const fail=message=>{result.textContent=`FAIL: ${message}`;document.title='FAIL';};let reset=null;host.addEventListener('xforms-reset-applied',e=>reset=e.detail);host.addEventListener('xforms-adapter-diagnostic',e=>fail(e.detail.message));host.addEventListener('xforms-action-diagnostic',e=>fail(e.detail.message));try{const summary=XFormRevival.XFormsComponentAdapter.upgrade(host);const trigger=document.querySelector('xforms-trigger#restore');if(summary.upgraded!==1||!trigger?.querySelector('template[data-xforms-action-declarations]')?.content.querySelector('xf\\:reset'))throw new Error('Adapted trigger did not retain its inert reset declaration.');}catch(error){fail(error.message);return;}host.addEventListener('xforms-ready',()=>{const input=document.querySelector('#name').shadowRoot.querySelector('input');input.value='Grace';input.dispatchEvent(new Event('input',{bubbles:true,composed:true}));const waitForMutation=()=>{if(input.value==='Grace'){document.querySelector('xforms-trigger#restore').shadowRoot.querySelector('button').click();return;}setTimeout(waitForMutation,25)};waitForMutation();});const tick=()=>{const input=document.querySelector('#name').shadowRoot?.querySelector('input');if(reset?.controlId==='restore'&&input?.value==='Ada'){result.textContent='PASS: Adapted source trigger reset declarations restore the worker baseline.';document.title='PASS';return;}setTimeout(tick,25)};tick();setTimeout(()=>{if(!result.textContent.startsWith('PASS'))fail('timed out');},5000)})()</script></body></html>
