<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-bind-target-resolver.js"></script><script src="../src/adapter/xforms-component-adapter.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model bind-controls><xf:model><xf:instance><data><name>Ada</name></data></xf:instance><xf:bind id="name-binding" ref="name"></xf:bind></xf:model><xf:input id="name-control" bind="name-binding"><xf:label>Name</xf:label></xf:input></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),result=document.querySelector('#result');const fail=message=>{result.textContent=`FAIL: ${message}`;document.title='FAIL';};host.addEventListener('xforms-adapter-diagnostic',e=>fail(e.detail.message));host.addEventListener('xforms-control-binding-diagnostic',e=>fail(e.detail.message));try{const summary=XFormRevival.XFormsComponentAdapter.upgrade(host);if(summary.upgraded!==1)throw new Error(`Expected one adapted bind control, got ${summary.upgraded}.`);}catch(error){fail(error.message);return;}host.addEventListener('xforms-ready',()=>{const control=document.querySelector('#name-control');try{if(control.getAttribute('bind')!=='name-binding'||control.getAttribute('node-id')!=='1'||control.shadowRoot.querySelector('input').value!=='Ada')throw new Error('Bind-ID association did not preserve metadata and project the discovered target.');const input=control.shadowRoot.querySelector('input');input.value='Grace';input.dispatchEvent(new Event('input',{bubbles:true,composed:true}));const tick=()=>{if(input.value==='Grace'){result.textContent='PASS: Source control bind IDs resolve to singleton discovered worker targets.';document.title='PASS';return;}setTimeout(tick,25)};tick();}catch(error)
