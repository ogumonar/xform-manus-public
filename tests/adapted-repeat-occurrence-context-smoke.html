<!doctype html><html><head><meta charset="utf-8"><script src="../src/xpath/xpath-compatibility.js"></script><script src="../src/adapter/xforms-model-discovery.js"></script><script src="../src/adapter/xforms-bind-target-resolver.js"></script><script src="../src/adapter/xforms-discovered-repeat-projector.js"></script><script src="../src/adapter/xforms-repeat-occurrence-context-adapter.js"></script><script src="../src/adapter/xforms-component-adapter.js"></script><script src="../src/worker/xform-engine-client.js"></script><script src="../src/components/xforms-components.js"></script></head><body><xforms-host id="host" discover-model project-repeats bind-repeat-controls><xf:model><xf:instance><data><person><name>Ada</name></person><person><name>Grace</name></person></data></xf:instance><xf:bind id="people" nodeset="/data/person"></xf:bind></xf:model><xforms-repeat id="repeat" bind-id="people"><template><xf:input class="person" ref="."><xf:label>Person</xf:label></xf:input><xf:output class="name" ref="name"><xf:label>Name</xf:label></xf:output></template></xforms-repeat></xforms-host><p id="result">Running…</p><script>(()=>{const host=document.querySelector('#host'),repeat=document.querySelector('#repeat'),result=document.querySelector('#result');const fail=message=>{result.textContent=`FAIL: ${message}`;document.title='FAIL';};host.addEventListener('xforms-adapter-diagnostic',e=>fail(e.detail.message));host.addEventListener('xforms-repeat-context-diagnostic',e=>fail(e.detail.message));try{const summary=XFormRevival.XFormsComponentAdapter.upgrade(host);if(summary.upgraded!==2)throw new Error(`Expected two template controls to adapt, got ${summary.upgraded}.`);}catch(error){fail(error.message);return;}host.addEventListener('xforms-ready',()=>{try{const occurrences=Array.from(repeat.shadowRoot.querySelectorAll('[part=occurrence]'));if(occurrences.length!==2)throw new Error('Expected two repeat occurrences.');const rows=occurrences.map(occurrence=>({person:occurrence.querySelector('.person'),name:occurrence.querySelector('.name')}));if(rows[0].person?.localName!=='xforms-input'||rows[0].name?.localName!=='xforms-output'||rows[0].person.getAttribute('ref')!=='.'||rows[0].name.getAttribute('ref')!=='name')throw new Error('Adapted template controls did not retain their component forms and refs.');if(rows[0].person.getAttribute('node-id')!=='1'||rows[0].name.getAttribute('node-id')!=='2'||rows[1].person.getAttribute('node-id')!=='3'||rows[1].name.getAttribute('node-id')!=='4')throw new Error('Adapted template controls did not receive occurrence-local compact targets.');if(!rows[0].name.shadowRoot.textContent.includes('Ada')||!rows[1].name.shadowRoot.textContent.includes('Grace'))throw new Error('Worker hydration did not project child values through the composed flow.');result.textContent='PASS: Adapted repeat template controls bind to occurrence-local worker targets.';document.title='PASS';}catch(error){fail(error.message);}});setTimeout(()=>{if(!result.textContent.startsWith('PASS'))fail('timed out');},5000)})()</script></body></html>
